name: php build xx IR

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read

jobs:
  php-application-build:
    runs-on: ubuntu-latest
    name: Run build with anomalies

    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{ secrets.IR_API_KEY }}
      # ============= InvisiRisk Setup End =============

      - uses: actions/checkout@v4
      
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"  # ✅ match composer.json requirement
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install project dependencies (retry on curl fail)
        run: |
          composer config --global audit.block-insecure false
          n=0
          until [ $n -ge 3 ]
          do
            composer install --prefer-dist --no-progress --no-interaction && break
            n=$((n+1))
            echo "Retrying composer install ($n/3)..."
            sleep 5
          done

      # ============= InvisiRisk Cleanup =============
      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@latest
        with:
          cleanup: "true"
      # ============= InvisiRisk Cleanup End =============
